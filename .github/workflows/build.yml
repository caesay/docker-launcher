name: Build / Containerize

on: [push]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v2

      - name: Install NBGV
        run: dotnet tool install --tool-path . nbgv

      - name: Get NBGV Version
        id: nbgv-version
        run: |
          c_version=$(nbgv get-version -v SimpleVersion -f text)
          echo "package version = ${c_version}"
          echo "C_VERSION=${c_version}" >> "$GITHUB_OUTPUT"

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build Docker image
      #   run: |
      #     docker build -t ${{ secrets.DOCKER_USERNAME }}/docker-launcher:${{ steps.nbgv-version.outputs.C_VERSION }} .
      #     docker tag ${{ secrets.DOCKER_USERNAME }}/docker-launcher:${{ steps.nbgv-version.outputs.C_VERSION }} ${{ secrets.DOCKER_USERNAME }}/docker-launcher:latest

      # - name: Push Docker image
      #   run: |
      #     docker push ${{ secrets.DOCKER_USERNAME }}/docker-launcher:${{ steps.nbgv-version.outputs.C_VERSION }}
      #     docker push ${{ secrets.DOCKER_USERNAME }}/docker-launcher:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Docker Hub tags (disabled):
          # caesay/docker-launcher:latest
          # caesay/docker-launcher:${{ steps.nbgv-version.outputs.C_VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.nbgv-version.outputs.C_VERSION }}
